version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Clean, compile, test, and verify the project
    cmds:
      - cmd /c mvnw.cmd clean verify

  test:
    desc: Run unit tests
    cmds:
      - cmd /c mvnw.cmd test

  run:
    desc: Start the Spring Boot application
    cmds:
      - cmd /c mvnw.cmd spring-boot:run